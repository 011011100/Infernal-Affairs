<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <script>
      // Apply the saved palette before the first paint, including on refresh.
      try {
        const theme =
          localStorage.getItem("wujian-theme-v1") === "light"
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#f3f5f8" : "#08090d";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta
      name="description"
      content="无间风云：4—8 人在线身份推理桌游。调查、瞄准、真假交锋，邀请好友进入同一张牌桌。"
    />
    <title>无间风云 · 每个人都有另一面</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
